<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#fff"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#111" stroke-width="20"/>

  <!-- 5x5 パターン -->
  <g fill="#111">
    <rect x="70" y="70" width="40" height="40"/>
    <rect x="190" y="70" width="40" height="40"/>
    <rect x="310" y="70" width="40" height="40"/>

    <rect x="70" y="190" width="40" height="40"/>
    <rect x="130" y="190" width="40" height="40"/>
    <rect x="190" y="190" width="40" height="40"/>
    <rect x="250" y="190" width="40" height="40"/>
    <rect x="310" y="190" width="40" height="40"/>

    <rect x="70" y="310" width="40" height="40"/>
    <rect x="190" y="310" width="40" height="40"/>
    <rect x="310" y="310" width="40" height="40"/>

    <rect x="130" y="130" width="40" height="40"/>
    <rect x="250" y="130" width="40" height="40"/>
    <rect x="130" y="250" width="40" height="40"/>
    <rect x="250" y="250" width="40" height="40"/>

    <!-- 中心の大きい四角 -->
    <rect x="180" y="180" width="40" height="40"/>
  </g>
</svg>
